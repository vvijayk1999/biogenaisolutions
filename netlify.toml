# Static site — no build step. Netlify serves site/ as-is.
[build]
  publish = "site"

# Pretty URLs for the section pages (served as folders with index.html),
# so /privacy resolves without the trailing slash.
[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms/index.html"
  status = 200

[[redirects]]
  from = "/legal"
  to = "/legal/index.html"
  status = 200

[[redirects]]
  from = "/news/:slug"
  to = "/news/:slug/index.html"
  status = 200
